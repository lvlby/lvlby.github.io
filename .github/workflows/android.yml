name: Build Android app

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Collect the web files
        run: |
          mkdir www
          cp index.html about.html privacy.html manifest.webmanifest www/
          cp icon-192.png icon-512.png icon-maskable-192.png icon-maskable-512.png apple-touch-icon.png www/

      - name: Install Capacitor and plugins
        run: npm install

      # The page is plain HTML (no bundler), so the Capacitor plugins are bundled
      # into ONE script (window.LvNative) that index.html loads only inside the app.
      - name: Bundle the native plugins for index.html
        run: |
          set -e
          npx esbuild native-plugins.entry.js --bundle --minify --format=iife --target=es2019 --external:'firebase/*' --outfile=www/native-plugins.js
          ls -l www/native-plugins.js
          test -s www/native-plugins.js

      - name: Create the Android project
        run: npx cap add android

      - name: Configure Firebase Google Services
        run: |
          set -e
          cp google-services.json android/app/google-services.json

          python3 - <<'PY'
          from pathlib import Path

          root_gradle = Path("android/build.gradle")
          root_text = root_gradle.read_text()
          plugin_classpath = "classpath 'com.google.gms:google-services:4.4.2'"
          if plugin_classpath not in root_text:
              if "dependencies {" not in root_text:
                  raise SystemExit("Could not find dependencies block in android/build.gradle")
              root_text = root_text.replace(
                  "dependencies {",
                  "dependencies {\n        " + plugin_classpath,
                  1,
              )
              root_gradle.write_text(root_text)

          app_gradle = Path("android/app/build.gradle")
          app_text = app_gradle.read_text()
          plugin_apply = "apply plugin: 'com.google.gms.google-services'"
          if plugin_apply not in app_text:
              app_gradle.write_text(app_text.rstrip() + "\n\n" + plugin_apply + "\n")

          # @capacitor-firebase/authentication Android setup for Google sign-in
          vars_gradle = Path("android/variables.gradle")
          vars_text = vars_gradle.read_text()
          if "rgcfaIncludeGoogle" not in vars_text:
              if "ext {" not in vars_text:
                  raise SystemExit("Could not find ext block in android/variables.gradle")
              vars_text = vars_text.replace(
                  "ext {",
                  "ext {\n    rgcfaIncludeGoogle = true\n    androidxCredentialsVersion = '1.3.0'",
                  1,
              )
              vars_gradle.write_text(vars_text)
          PY

      # Google sign-in on Android only works if the APK is signed with the SAME key
      # whose SHA-1 is registered in Firebase. Without the three secrets below, every
      # build gets a new random key and Google sign-in cannot work.
      - name: Use the fixed signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -e
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ] || [ -z "$KS_ALIAS" ]; then
            echo "::warning title=No signing key::The secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS are missing. This APK gets a random key, so Google sign-in will NOT work. See GOOGLE-SIGNIN-SETUP.txt."
            exit 0
          fi
          echo "$KS_B64" | base64 -d > android/app/lvlby.keystore
          python3 - <<'PY'
          from pathlib import Path
          g = Path("android/app/build.gradle")
          t = g.read_text()
          if "signingConfigs" in t:
              raise SystemExit("build.gradle already has signingConfigs; refusing to patch blindly")
          block = (
              "android {\n"
              "    signingConfigs {\n"
              "        debug {\n"
              "            storeFile file('lvlby.keystore')\n"
              "            storePassword System.getenv('LVLBY_KS_PASS')\n"
              "            keyAlias System.getenv('LVLBY_KS_ALIAS')\n"
              "            keyPassword System.getenv('LVLBY_KS_PASS')\n"
              "        }\n"
              "    }\n"
          )
          if t.count("android {\n") < 1:
              raise SystemExit("Could not find the android { block in app/build.gradle")
          g.write_text(t.replace("android {\n", block, 1))
          PY
          echo "Fixed signing key installed."

      - name: Patch manifest, version and icons
        run: |
          set -e

          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n    <application#' "$M"

          G=android/app/build.gradle
          sed -i "s/versionCode 1/versionCode ${GITHUB_RUN_NUMBER}/" "$G"
          sed -i "s/versionName \"1.0\"/versionName \"36.${GITHUB_RUN_NUMBER}\"/" "$G"

          R=android/app/src/main/res

          if command -v magick >/dev/null 2>&1; then
            IM="magick"
          else
            IM="convert"
          fi

          for d in "mdpi 48 108" "hdpi 72 162" "xhdpi 96 216" "xxhdpi 144 324" "xxxhdpi 192 432"; do
            set -- $d
            $IM icon-192.png -resize ${2}x${2} "$R/mipmap-$1/ic_launcher.png" || true
            $IM icon-192.png -resize ${2}x${2} "$R/mipmap-$1/ic_launcher_round.png" || true
            $IM icon-maskable-512.png -resize ${3}x${3} "$R/mipmap-$1/ic_launcher_foreground.png" || true
          done

          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#101522</color>\n</resources>\n' > "$R/values/ic_launcher_background.xml"

      - name: Copy web files into the app
        run: npx cap sync android

      - name: Build the APK
        working-directory: android
        env:
          LVLBY_KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LVLBY_KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: ./gradlew assembleDebug

      - name: Name the file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk LvLBY.apk

      # Prints the APK's real signing fingerprints and compares them with google-services.json.
      - name: Show signing fingerprints
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs LvLBY.apk | tee certs.txt
          SHA1=$(grep -i 'SHA-1 digest' certs.txt | head -1 | sed 's/.*: *//' | tr -d ' :' | tr 'A-F' 'a-f')
          SHA256=$(grep -i 'SHA-256 digest' certs.txt | head -1 | sed 's/.*: *//' | tr -d ' :' | tr 'A-F' 'a-f')
          {
            echo "### APK signing fingerprints"
            echo "- SHA-1: \`$SHA1\`"
            echo "- SHA-256: \`$SHA256\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if grep -qi "\"certificate_hash\": \"$SHA1\"" google-services.json; then
            echo "This APK's SHA-1 is in google-services.json: Google sign-in can work."
            echo "- Matches google-services.json: yes" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=SHA-1 mismatch::This APK's SHA-1 ($SHA1) is NOT in google-services.json. Add it in Firebase (Project settings > your Android app > Add fingerprint), download the new google-services.json and upload it to the repository. Google sign-in will fail until then."
            echo "- Matches google-services.json: NO. Add this SHA-1 in Firebase and replace google-services.json." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: LvLBY-apk
          path: LvLBY.apk

      - name: Publish a release with the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "app-${GITHUB_RUN_NUMBER}" LvLBY.apk \
            --title "LvLBY app ${GITHUB_RUN_NUMBER}" \
            --notes "Android app with phone-side reminders and native Google sign-in. Install LvLBY.apk."
